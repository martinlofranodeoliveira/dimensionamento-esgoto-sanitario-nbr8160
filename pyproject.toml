[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dimensionamento-esgoto-sanitario-nbr8160"
version = "1.0.0"
description = "Dimensionamento hidráulico e sanitário de sistemas prediais de esgoto e ventilação segundo a ABNT NBR 8160:1999. 100% Python padrão, Zero Float."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Martin Lofrano de Oliveira", email = "martin@lofrano.com.br" },
    { name = "LOFRANO TECNOLOGIA", email = "contato@lofrano.com.br" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Civil Engineering",
    "Natural Language :: Portuguese (Brazilian)"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/martinlofranodeoliveira/dimensionamento-esgoto-sanitario-nbr8160"
Repository = "https://github.com/martinlofranodeoliveira/dimensionamento-esgoto-sanitario-nbr8160.git"
Issues = "https://github.com/martinlofranodeoliveira/dimensionamento-esgoto-sanitario-nbr8160/issues"

[project.scripts]
esgoto-sanitario = "esgoto_sanitario_nbr8160.cli:main"
dimensionamento-esgoto = "esgoto_sanitario_nbr8160.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]
